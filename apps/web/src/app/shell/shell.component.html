<div class="shell">
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">personal-librarium</span>
    </div>
    <nav>
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="page-title">{{ pageTitle() }}</span>
      <a routerLink="/import" class="btn-import">
        <i class="pi pi-plus"></i>
        <span>Importar</span>
      </a>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
