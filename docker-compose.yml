version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - .:/workspace
      - /workspace/node_modules
    command: pnpm nx serve api

networks:
  default:
    name: librarium-network
